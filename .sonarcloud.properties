# SonarCloud automatic analysis settings.
# Deployment records are generated JSON listing public contract addresses (keys such as "nativeToken"), not code or secrets.
sonar.exclusions=chain/deployment*.json,chain/ant-pools.json
sonar.tests=chain/test
sonar.test.inclusions=chain/test/**
# Every static page repeats the same header, menu and footer markup by design (no template engine).
sonar.cpd.exclusions=site/**/*.html
